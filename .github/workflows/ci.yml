name: Continuous Integration (CI)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test_and_lint:
    name: Code Quality & Build Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Production Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci_runner:ci_runner@localhost:5432/ci_db' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'aaaa-aaaa-aaaa-aaaa-aaaa-aaaa-aaaa-aaaa' }}
        run: npm run build
