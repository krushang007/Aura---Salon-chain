name: Deploy - AWS EC2

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Docker image tag to deploy (Git commit SHA or latest)'
        required: true
        default: 'latest'

jobs:
  deploy_to_ec2:
    name: Deploy Container to AWS EC2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ECR Authentication on EC2
        uses: appleboy/ssh-action@master
        with:
          # Non-critical host / username / port from GitHub Variables (with fallback to Secrets if defined)
          host: ${{ vars.VM_HOST || secrets.VM_HOST }}
          username: ${{ vars.VM_USERNAME || 'ubuntu' }}
          port: ${{ vars.VM_SSH_PORT || 22 }}
          # Critical private key from GitHub Secrets
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p ~/salon-booking
            aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REGISTRY || secrets.ECR_REGISTRY }}

      - name: Copy Compose & Env to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.VM_HOST || secrets.VM_HOST }}
          username: ${{ vars.VM_USERNAME || 'ubuntu' }}
          port: ${{ vars.VM_SSH_PORT || 22 }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "docker-compose.prod.yml,.env.production"
          target: "~/salon-booking/"

      - name: Restart Services with Zero Downtime
        uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.VM_HOST || secrets.VM_HOST }}
          username: ${{ vars.VM_USERNAME || 'ubuntu' }}
          port: ${{ vars.VM_SSH_PORT || 22 }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/salon-booking

            # Update or create environment variable configuration for docker-compose
            if [ ! -f .env ]; then
              echo "APP_IMAGE_TAG=${{ github.event.inputs.imageTag }}" > .env
              echo "ECR_REGISTRY=${{ vars.ECR_REGISTRY || secrets.ECR_REGISTRY }}" >> .env
            else
              sed -i "s|^APP_IMAGE_TAG=.*|APP_IMAGE_TAG=${{ github.event.inputs.imageTag }}|" .env
              if ! grep -q "^ECR_REGISTRY=" .env; then
                echo "ECR_REGISTRY=${{ vars.ECR_REGISTRY || secrets.ECR_REGISTRY }}" >> .env
              fi
            fi

            # Pull target image and recreate app container
            echo "Pulling latest image: ${{ github.event.inputs.imageTag }}..."
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --no-deps app
            docker system prune -f

            echo "Deployment to EC2 completed successfully!"
